spring.application.name=colegio-disciplina

spring.data.mongodb.uri=mongodb://localhost:27017/colegio_disciplina
spring.data.mongodb.auto-index-creation=true

server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT: el token vence a los 30 minutos
jwt.secret=${JWT_SECRET:cambia-este-secreto-en-produccion-minimo-32-caracteres-siuce}
jwt.expiration-ms=1800000

# Origen permitido del frontend
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}